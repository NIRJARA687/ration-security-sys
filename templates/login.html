<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ration Security System</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #eef2ff, #f0fdf4);
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: white;
            border-radius: 22px;
            overflow: hidden;
            box-shadow: 0 15px 45px rgba(0,0,0,0.12);
            display: grid;
            grid-template-columns: 1fr 1fr;
        }

        .welcome {
            background: linear-gradient(145deg, #166534, #22c55e);
            color: white;
            padding: 45px 35px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .welcome .emoji {
            font-size: 60px;
            margin-bottom: 20px;
        }

        .welcome h1 {
            font-size: 34px;
            margin-bottom: 12px;
        }

        .welcome p {
            font-size: 16px;
            line-height: 1.6;
            opacity: 0.92;
        }

        .login-box {
            padding: 40px 35px;
        }

        .login-box h2 {
            color: #166534;
            margin-bottom: 25px;
            font-size: 27px;
        }

        .role-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 25px;
        }

        .role-option {
            position: relative;
        }

        .role-option input {
            display: none;
        }

        .role-option label {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            cursor: pointer;
            text-align: center;
            padding: 10px;
            transition: 0.2s;
            font-size: 13px;
            font-weight: bold;
            color: #555;
        }

        .role-icon {
            font-size: 27px;
            margin-bottom: 7px;
        }

        .role-option input:checked + label {
            border-color: #16a34a;
            background: #f0fdf4;
            color: #166534;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
            color: #333;
        }

        .input-group input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
        }

        .input-group input:focus {
            border-color: #16a34a;
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 9px;
            background: linear-gradient(135deg, #166534, #22c55e);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .login-btn:hover {
            opacity: 0.92;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 11px;
            border-radius: 8px;
            margin-bottom: 18px;
            font-size: 14px;
        }

        @media (max-width: 700px) {
            .container {
                grid-template-columns: 1fr;
            }

            .welcome {
                padding: 30px;
            }

            .welcome h1 {
                font-size: 27px;
            }

            .role-container {
                grid-template-columns: 1fr 1fr 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- LEFT SIDE -->

    <div class="welcome">

        <div class="emoji">
            🌾 📦 🏪
        </div>

        <h1>Ration Security System</h1>

        <p>
            Secure ration stock and distribution management
        </p>

    </div>


    <!-- LOGIN SIDE -->

    <div class="login-box">

        <h2>Login</h2>


        {% if error %}
        <div class="error">
            {{ error }}
        </div>
        {% endif %}


        <form method="POST">

            <!-- ROLE -->

            <div class="role-container">

                <div class="role-option">

                    <input
                        type="radio"
                        id="godown"
                        name="role"
                        value="godown"
                        checked
                    >

                    <label for="godown">

                        <span class="role-icon">🏭</span>

                        Godown

                    </label>

                </div>


                <div class="role-option">

                    <input
                        type="radio"
                        id="shop"
                        name="role"
                        value="shop"
                    >

                    <label for="shop">

                        <span class="role-icon">🏪</span>

                        Ration Shop

                    </label>

                </div>


                <div class="role-option">

                    <input
                        type="radio"
                        id="people"
                        name="role"
                        value="people"
                    >

                    <label for="people">

                        <span class="role-icon">👨‍👩‍👧</span>

                        People

                    </label>

                </div>

            </div>


            <!-- USERNAME -->

            <div class="input-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter username"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="input-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-btn"
            >
                Login
            </button>

        </form>

    </div>

</div>

</body>
</html>
